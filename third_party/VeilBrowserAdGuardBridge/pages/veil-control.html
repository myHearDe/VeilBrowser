<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>AdGuard 控制中心</title>
    <link rel="stylesheet" href="veil-control.css">
</head>
<body>
    <header>
        <div class="brand-mark" aria-hidden="true">✓</div>
        <div>
            <strong>AdGuard</strong>
            <span id="extensionState">正在连接保护引擎…</span>
        </div>
        <span class="status-dot" id="statusDot" aria-hidden="true"></span>
    </header>

    <main>
        <section class="hero">
            <div class="eyebrow">当前网站</div>
            <h1 id="siteName">正在读取标签页</h1>
            <p id="siteAddress">请稍候…</p>
            <div class="metrics">
                <div><strong id="pageBlocked">—</strong><span>本页已拦截</span></div>
                <div><strong id="totalBlocked">—</strong><span>累计已拦截</span></div>
            </div>
        </section>

        <section class="card">
            <div class="row">
                <div>
                    <strong>当前网站防护</strong>
                    <span id="siteProtectionText">正在获取状态</span>
                </div>
                <button id="siteToggle" class="switch" type="button" disabled
                        aria-label="切换当前网站防护" aria-pressed="false">
                    <span></span>
                </button>
            </div>
        </section>

        <button id="pickElement" class="primary" type="button" disabled>
            <span class="picker-icon" aria-hidden="true">⌖</span>
            <span><strong>选择页面元素</strong><small>在网页上点选并永久隐藏广告</small></span>
        </button>

        <section class="actions" aria-label="AdGuard 工具">
            <button data-page="fullscreen-user-rules.html" type="button">
                <span>≡</span><strong>自定义规则</strong><small>编写过滤规则</small>
            </button>
            <button data-page="filtering-log.html" type="button">
                <span>⌁</span><strong>过滤日志</strong><small>查看请求详情</small>
            </button>
            <button data-page="options.html" type="button">
                <span>⚙</span><strong>完整设置</strong><small>过滤器与隐私</small>
            </button>
        </section>

        <div id="message" role="status" aria-live="polite"></div>
    </main>

    <footer>
        <span>AdGuard Browser Extension 5.4.3.1</span>
        <button id="retry" type="button">重新连接</button>
    </footer>
    <script src="veil-control.js"></script>
</body>
</html>
